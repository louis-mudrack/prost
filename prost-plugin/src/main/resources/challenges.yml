# Prost challenge catalogue. Written once by the plugin, then yours: /prost reload reads it again. A broken entry is skipped
# with a warning.
# sips = fixed penalty shown at the start (1-6); give = what a winner hands out (default sips); kinds: team each race duel solo
# reaction (reaction: only with tracker reaction); rewards: handout rule joker next; needs: nether end night day rain thunder.
# Team without rule/joker/next = a joker each. Tracker reaction, mode: crouch water chat look_up jump hold sit eat freeze
# (chat: value = the word, hold: targets). since = the Prost version that added the entry.

