crouch_time: {name: {de: "Kniebeugen", en: "Squats"}, text: {de: "Schleiche insgesamt {amount} Sekunden", en: "Crouch for {amount} seconds in total"}, tracker: stat, stat: SNEAK_TIME, amount: 60, seconds: 300, sips: 1, kinds: [each, solo], rewards: [handout]}
no_jump: {name: {de: "Am Boden kleben", en: "Glued to the floor"}, text: {de: "Spring nicht, bis die Zeit um ist", en: "Don't jump until the time is up"}, tracker: avoid, mode: jump, seconds: 300, sips: 2, kinds: [team, each, solo], rewards: [handout]}
no_sprint: {name: {de: "Zeitlupe", en: "Slow motion"}, text: {de: "Sprinte nicht, bis die Zeit um ist", en: "Don't sprint until the time is up"}, tracker: avoid, mode: sprint, seconds: 300, sips: 2, kinds: [team, each, solo], rewards: [handout]}
crouch_walk: {name: {de: "Schleicher", en: "Sneaky"}, text: {de: "Schleiche {amount} Blöcke weit", en: "Sneak {amount} blocks"}, tracker: stat, stat: CROUCH_ONE_CM, amount: 50, seconds: 300, sips: 2, kinds: [each, race, solo], rewards: [handout]}
fall_far: {name: {de: "Schwerkraft", en: "Gravity"}, text: {de: "Falle insgesamt {amount} Blöcke tief", en: "Fall {amount} blocks in total"}, tracker: stat, stat: FALL_ONE_CM, amount: 50, seconds: 300, sips: 2, kinds: [each, race, solo], rewards: [handout]}
note_blocks: {name: {de: "Musikant", en: "Musician"}, text: {de: "Spiele {amount}-mal einen Notenblock", en: "Play a note block {amount} times"}, tracker: stat, stat: NOTEBLOCK_PLAYED, amount: 20, seconds: 360, sips: 2, kinds: [each, race, solo], rewards: [handout]}
ring_bell: {name: {de: "Bimmelbammel", en: "Ding dong"}, text: {de: "Läute {amount}-mal eine Glocke", en: "Ring a bell {amount} times"}, tracker: stat, stat: BELL_RING, amount: 3, seconds: 720, sips: 4, kinds: [race, solo], rewards: [handout]}
pot_flowers: {name: {de: "Dekorateur", en: "Decorator"}, text: {de: "Topfe {amount} Pflanzen ein", en: "Pot {amount} plants"}, tracker: stat, stat: FLOWER_POTTED, amount: 3, seconds: 480, sips: 2, kinds: [each, race, solo], rewards: [handout]}
hit_target: {name: {de: "Scharfschütze", en: "Sharpshooter"}, text: {de: "Triff {amount}-mal einen Zielblock", en: "Hit a target block {amount} times"}, tracker: stat, stat: TARGET_HIT, amount: 5, seconds: 600, sips: 3, kinds: [each, solo], rewards: [handout]}
minecart_ride: {name: {de: "Achterbahn", en: "Rollercoaster"}, text: {de: "Fahre {amount} Blöcke Lore", en: "Ride {amount} blocks in a minecart"}, tracker: stat, stat: MINECART_ONE_CM, amount: 100, seconds: 600, sips: 3, kinds: [each, race, solo], rewards: [handout]}
pumpkin_head: {name: {de: "Kürbiskopf", en: "Pumpkin head"}, text: {de: "Trage {amount} Sekunden einen geschnitzten Kürbis auf dem Kopf", en: "Wear a carved pumpkin on your head for {amount} seconds"}, tracker: wear, mode: head, targets: [CARVED_PUMPKIN], amount: 180, seconds: 360, sips: 3, kinds: [each, solo], rewards: [handout]}

# --- Endurance ---
no_damage: {name: {de: "Unberührbar", en: "Untouchable"}, text: {de: "Nimm keinen Schaden, bis die Zeit um ist", en: "Take no damage until the time is up"}, tracker: avoid, mode: damage, seconds: 600, sips: 3, kinds: [team, each, solo], rewards: [handout]}
no_death: {name: {de: "Überlebender", en: "Survivor"}, text: {de: "Stirb nicht, bis die Zeit um ist", en: "Don't die until the time is up"}, tracker: avoid, mode: death, seconds: 900, sips: 2, kinds: [team, each, solo], rewards: [handout]}
night_awake: {name: {de: "Nachtwache", en: "Night watch"}, text: {de: "Schlafe nicht und nimm keinen Schaden, bis die Zeit um ist", en: "Don't sleep and take no damage until the time is up"}, tracker: avoid, mode: "sleep,damage", seconds: 420, sips: 4, kinds: [team, each, solo], rewards: [handout], needs: [night]}
no_mining: {name: {de: "Finger weg", en: "Hands off"}, text: {de: "Baue keinen Block ab, bis die Zeit um ist", en: "Don't break a single block until the time is up"}, tracker: avoid, mode: break, seconds: 300, sips: 2, kinds: [team, each, solo], rewards: [handout]}
no_water: {name: {de: "Wasserscheu", en: "Water-shy"}, text: {de: "Berühre kein Wasser, bis die Zeit um ist", en: "Don't touch water until the time is up"}, tracker: avoid, mode: water, seconds: 480, sips: 2, kinds: [each, solo], rewards: [handout]}
no_chat: {name: {de: "Schweigeminute", en: "Silence"}, text: {de: "Schreib nichts in den Chat, bis die Zeit um ist", en: "Don't write in chat until the time is up"}, tracker: avoid, mode: chat, seconds: 600, sips: 2, kinds: [team, each, solo], rewards: [handout]}
pacifist: {name: {de: "Pazifist", en: "Pacifist"}, text: {de: "Töte kein einziges Tier oder Monster, bis die Zeit um ist", en: "Don't kill a single mob until the time is up"}, tracker: avoid, mode: kill, seconds: 600, sips: 2, kinds: [team, each, solo], rewards: [handout]}

# --- Social (2+ players) ---
meet_up: {name: {de: "Treffpunkt", en: "Meet up"}, text: {de: "Trefft euch alle innerhalb von 5 Blöcken", en: "All of you meet within 5 blocks"}, tracker: proximity, mode: all, value: 5, seconds: 180, sips: 2, kinds: [team], rewards: [rule, next], min-players: 2}
one_block: {name: {de: "Ein Block", en: "One block"}, text: {de: "Stellt euch alle auf denselben Block", en: "All of you stand on the same block"}, tracker: proximity, mode: block, value: 1, seconds: 240, sips: 3, kinds: [team], rewards: [rule], min-players: 2}
gift_flower: {name: {de: "Blumengruß", en: "Flower gift"}, text: {de: "Lass dir von einem anderen Spieler eine Blume schenken", en: "Get a flower from another player"}, tracker: gift, targets: ["#flowers"], amount: 1, seconds: 360, sips: 2, kinds: [each], rewards: [handout], min-players: 2}
share_food: {name: {de: "Teilen macht Freude", en: "Sharing is caring"}, text: {de: "Lass dir von einem anderen Spieler etwas zu essen schenken", en: "Get some food from another player"}, tracker: gift, targets: ["#food"], amount: 1, seconds: 360, sips: 2, kinds: [each], rewards: [handout], min-players: 2}
trade_villager: {name: {de: "Händler", en: "Merchant"}, text: {de: "Handle {amount}-mal mit Dorfbewohnern", en: "Trade with villagers {amount} times"}, tracker: stat, stat: TRADED_WITH_VILLAGER, amount: 3, seconds: 600, sips: 3, kinds: [each, race, solo], rewards: [handout]}
talk_villager: {name: {de: "Smalltalk", en: "Small talk"}, text: {de: "Sprich {amount}-mal mit Dorfbewohnern", en: "Talk to villagers {amount} times"}, tracker: stat, stat: TALKED_TO_VILLAGER, amount: 5, seconds: 360, sips: 1, kinds: [each, solo], rewards: [handout]}
hug: {name: {de: "Kuscheln", en: "Hug it out"}, text: {de: "Schleiche {amount}-mal direkt neben einem anderen Spieler", en: "Crouch {amount} times right next to another player"}, tracker: proximity, mode: hug, value: 2, amount: 10, seconds: 180, sips: 1, kinds: [each], rewards: [handout], min-players: 2}

# --- Reaction ---
react_crouch: {name: {de: "In Deckung!", en: "Take cover!"}, text: {de: "Schleiche - schnell!", en: "Crouch - quick!"}, tracker: reaction, mode: crouch, seconds: 15, sips: 1, kinds: [reaction], rewards: [handout], since: "0.4.0"}
react_water: {name: {de: "Abkühlung", en: "Cool down"}, text: {de: "Spring ins Wasser", en: "Get into water"}, tracker: reaction, mode: water, seconds: 60, sips: 2, kinds: [reaction, solo], rewards: [handout], since: "0.4.0"}
react_chat: {name: {de: "Prost!", en: "Cheers!"}, text: {de: "Schreib \"Prost\" in den Chat", en: "Write \"Prost\" in chat"}, tracker: reaction, mode: chat, value: "Prost", seconds: 30, sips: 1, kinds: [reaction], rewards: [handout], since: "0.4.0"}
react_look_up: {name: {de: "Sternengucker", en: "Stargazer"}, text: {de: "Schau senkrecht nach oben", en: "Look straight up"}, tracker: reaction, mode: look_up, seconds: 15, sips: 1, kinds: [reaction], rewards: [handout], since: "0.4.0"}
react_jump: {name: {de: "Hopp!", en: "Hop!"}, text: {de: "Spring!", en: "Jump!"}, tracker: reaction, mode: jump, seconds: 15, sips: 1, kinds: [reaction], rewards: [handout], since: "0.4.0"}
react_dirt: {name: {de: "Dreckspatz", en: "Dirty hands"}, text: {de: "Halte Erde in der Hand", en: "Hold dirt in your hand"}, tracker: reaction, mode: hold, targets: [DIRT], seconds: 60, sips: 2, kinds: [reaction, solo], rewards: [handout], since: "0.4.0"}
react_sit: {name: {de: "Platz nehmen", en: "Take a seat"}, text: {de: "Setz dich in ein Boot, eine Lore oder auf ein Reittier", en: "Sit in a boat, a minecart or on a mount"}, tracker: reaction, mode: sit, seconds: 60, sips: 2, kinds: [reaction, solo], rewards: [handout], since: "0.4.0"}
react_eat: {name: {de: "Snackpause", en: "Snack break"}, text: {de: "Iss etwas", en: "Eat something"}, tracker: reaction, mode: eat, seconds: 30, sips: 1, kinds: [reaction, solo], rewards: [handout], since: "0.4.0"}
react_freeze: {name: {de: "Eingefroren", en: "Freeze!"}, text: {de: "Beweg dich nicht von der Stelle", en: "Don't move from the spot"}, tracker: reaction, mode: freeze, seconds: 10, sips: 1, kinds: [reaction, solo], rewards: [handout], since: "0.4.0"}
