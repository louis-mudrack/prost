# Prepared real-life rules a winner can pick as a reward. Written once, then yours; /prost reload reads it again.
- {de: "Niemand darf \"ich\" sagen.", en: "Nobody may say \"I\"."}
- {de: "Getrunken wird nur mit der linken Hand.", en: "Drink only with your left hand."}
- {de: "Vor jedem Schluck wird \"Prost\" gerufen.", en: "Shout \"Prost\" before every sip."}
- {de: "Wer \"Minecraft\" sagt, trinkt.", en: "Whoever says \"Minecraft\" drinks."}
- {de: "Niemand darf Namen sagen, nur Spitznamen.", en: "No names, only nicknames."}
- {de: "Jeder Satz endet mit \"Diggi\".", en: "Every sentence ends with \"mate\"."}
- {de: "Wer flucht, trinkt.", en: "Whoever swears drinks."}
- {de: "Vor dem Trinken zeigst du an die Decke.", en: "Point at the ceiling before you drink."}
- {de: "Wer aufs Handy schaut, trinkt.", en: "Whoever looks at their phone drinks."}
- {de: "Es wird nur noch geflüstert.", en: "Whisper only."}
- {de: "Wer nach einem Tod im Spiel als Erster lacht, trinkt.", en: "The first to laugh after an in-game death drinks."}
- {de: "Wer \"nein\" sagt, trinkt.", en: "Whoever says \"no\" drinks."}
- {de: "Vor dem Reden hebst du die Hand.", en: "Raise your hand before you speak."}
- {de: "Trinkt der Regelmacher, trinken alle.", en: "When the rule maker drinks, everyone drinks."}
- {de: "Daumenmeister: wer seinen Daumen zuletzt auf den Tisch legt, trinkt.", en: "Thumb master: the last to put their thumb on the table drinks."}
- {de: "Alle reden wie Piraten.", en: "Everyone talks like a pirate."}
- {de: "Wer \"Diamant\" sagt, trinkt.", en: "Whoever says \"diamond\" drinks."}
- {de: "Vor dem Trinken wird mit jemandem angestoßen.", en: "Clink glasses with someone before you drink."}
- {de: "Wer im Spiel stirbt, ruft laut \"Neeein!\".", en: "Whoever dies in the game shouts \"Noooo!\"."}
- {de: "Wer \"okay\" sagt, trinkt.", en: "Whoever says \"okay\" drinks."}
- {de: "Wer eine Frage stellt, trinkt.", en: "Whoever asks a question drinks."}
- {de: "Das Glas wird nie in der Hand gehalten, nur abgestellt.", en: "Never hold your glass, always put it down."}
- {de: "Jeder Satz muss sich reimen.", en: "Every sentence has to rhyme."}
- {de: "Wer Schule oder Arbeit erwähnt, trinkt.", en: "Whoever mentions school or work drinks."}
- {de: "Trinkbuddy: der Regelmacher wählt jemanden - trinkt einer, trinkt der andere mit.", en: "Drinking buddy: the rule maker picks someone - when one drinks, so does the other."}
- {de: "Wer im Spiel stirbt, trinkt einen Schluck.", en: "Whoever dies in the game drinks one sip."}
- {de: "Vor dem Trinken sagst du dein Lieblingserz.", en: "Name your favourite ore before you drink."}
- {de: "Wer eine Kreatur im Spiel beim Namen nennt, macht ihr Geräusch nach.", en: "Whoever names a mob does its sound."}
- {de: "Beim Trinken schaust du allen in die Augen.", en: "Look everyone in the eye while you drink."}
- {de: "Wer \"wie bitte\" sagt, trinkt.", en: "Whoever says \"pardon\" drinks."}
