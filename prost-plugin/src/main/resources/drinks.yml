# AniDrinks tunables (spec docs/superpowers/specs/2026-10-15-anidrinks-design.md §12.1). Written once, then yours:
# a deploy never overwrites it. /prost reload reads it again. Missing or invalid values use these defaults.
max-players: 8
warmup-seconds: 120
pace: {chill: [720, 1080], normal: [480, 720], party: [240, 420]}   # seconds between two challenges
kind-weights: {team: 20, each: 25, race: 15, duel: 10, solo: 15}
reward-seconds: 60          # how long winners have to choose / hand out
joker: {max: 2, offer-seconds: 10}
limit: {default: 20, min: 5, max: 40}   # sips per rolling hour, set by each member
roulette:
  chances: {block: 0.003, craft: 0.01, kill: 0.02, eat: 0.02, fish: 0.02, breed: 0.02, trade: 0.02, enchant: 0.02,
            advancement: 0.10, death: 0.10, sleep: 0.10, boss: 0.25}
  max-hits: 3               # per member per window
  window-minutes: 30
  min-gap-minutes: 4
  weights: [40, 30, 20, 10] # 1, 2, 3, 4 sips
rules: {max-active: 5, reminder-minutes: 10, custom-max-length: 60}
offline-grace-minutes: 10
