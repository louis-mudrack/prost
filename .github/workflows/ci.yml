name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # basic = the MIT cache on actions/cache, no Gradle terms of use
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build and unit tests
        run: ./gradlew build
      - name: MariaDB tests
        run: ./gradlew integrationTest
      - uses: actions/upload-artifact@v7
        with:
          name: prost-jars
          path: |
            prost-plugin/build/libs/Prost-*.jar
            prost-api/build/libs/prost-api-*.jar
            !prost-plugin/build/libs/*-plain.jar
